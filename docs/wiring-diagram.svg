<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Melty ESP32 wiring diagram" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .box { fill: #f6f7f9; stroke: #2b2f36; stroke-width: 2; }
    .title { font-size: 17px; font-weight: 700; fill: #15181d; }
    .sub { font-size: 12px; fill: #59616d; }
    .pin { font-size: 13px; fill: #15181d; }
    .tag { font-size: 12px; fill: #15181d; }
    .wire { fill: none; stroke-width: 3; stroke-linejoin: round; }
    .bat { stroke: #b4532a; stroke-width: 5; }
    .gnd { stroke: #1d2026; }
    .v5 { stroke: #d42a2a; }
    .ibus { stroke: #7a3fc4; }
    .esc { stroke: #0f7f8c; }
    .i2c { stroke: #1e63d0; }
    .led { stroke: #c98a00; }
    .motor { stroke: #7b828c; }
    .part { fill: #fff; stroke: #2b2f36; stroke-width: 2; }
    .note { font-size: 13px; fill: #15181d; }
  </style>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="40" y="32" font-size="22" font-weight="700" fill="#15181d">Melty ESP32 wiring</text>

  <!-- Battery wiring -->
  <path class="wire bat" d="M90 130 V230"/>
  <path class="wire bat" d="M170 130 V230"/>
  <rect class="part" x="150" y="163" width="40" height="34"/>
  <text class="tag" x="200" y="177">Removable link or</text>
  <text class="tag" x="200" y="193">screw switch, in + lead</text>

  <!-- Motor wiring -->
  <path class="wire motor" d="M85 480 V600 M115 480 V600 M195 480 V600 M225 480 V600"/>

  <!-- ESC to ESP32 -->
  <path class="wire esc" d="M270 290 H520"/>
  <path class="wire v5" d="M270 320 H520"/>
  <path class="wire gnd" d="M270 350 H520"/>
  <path class="wire esc" d="M270 390 H520"/>
  <text class="tag" x="290" y="284">Signal A</text>
  <text class="tag" x="290" y="314">5V from ESC BEC</text>
  <text class="tag" x="290" y="344">GND</text>
  <text class="tag" x="290" y="384">Signal B</text>

  <!-- 5V rail -->
  <path class="wire v5" d="M440 320 V195 H860 M860 150 V275 M860 150 H900 M860 275 H900"/>

  <!-- GND rail -->
  <path class="wire gnd" d="M480 350 V620 H960 M820 185 V620 M820 185 H900 M820 305 H900"/>

  <!-- iBUS and divider -->
  <path class="wire ibus" d="M900 105 H720 V290 H700"/>
  <rect class="part" x="702" y="125" width="36" height="52"/>
  <text class="tag" x="720" y="155" text-anchor="middle">1k</text>
  <path class="wire gnd" d="M720 290 H820"/>
  <rect class="part" x="745" y="274" width="52" height="32"/>
  <text class="tag" x="771" y="295" text-anchor="middle">2k</text>
  <text class="tag" x="690" y="145" text-anchor="end">iBUS divider, skip only if a</text>
  <text class="tag" x="690" y="161" text-anchor="end">scope shows 3.3V or lower</text>

  <!-- I2C -->
  <path class="wire i2c" d="M700 340 H900"/>
  <path class="wire i2c" d="M700 380 H900"/>

  <!-- LED -->
  <path class="wire led" d="M700 520 H920"/>
  <rect class="part" x="745" y="504" width="52" height="32"/>
  <text class="tag" x="771" y="525" text-anchor="middle">R</text>
  <path class="wire gnd" d="M960 520 V620"/>
  <polygon points="920,500 920,540 950,520" fill="#ffd34d" stroke="#2b2f36" stroke-width="2"/>
  <path d="M950 500 V540" stroke="#2b2f36" stroke-width="3"/>
  <path class="wire gnd" d="M950 520 H960"/>

  <!-- Junction dots -->
  <g fill="#d42a2a">
    <circle cx="440" cy="320" r="6"/><circle cx="860" cy="195" r="6"/>
  </g>
  <g fill="#1d2026">
    <circle cx="480" cy="350" r="6"/><circle cx="820" cy="290" r="6"/><circle cx="820" cy="305" r="6"/><circle cx="820" cy="620" r="6"/>
  </g>
  <circle cx="720" cy="290" r="6" fill="#7a3fc4"/>

  <!-- Parts -->
  <rect class="box" x="40" y="50" width="190" height="80" rx="6"/>
  <text class="title" x="135" y="86" text-anchor="middle">3S LiPo</text>
  <text class="pin" x="90" y="118" text-anchor="middle">-</text>
  <text class="pin" x="170" y="118" text-anchor="middle">+</text>

  <rect class="box" x="40" y="230" width="230" height="250" rx="6"/>
  <text class="title" x="60" y="285">Repeat dual</text>
  <text class="title" x="60" y="306">brushed ESC</text>
  <text class="sub" x="60" y="328">Mixing jumper uncut</text>
  <text class="pin" x="90" y="250" text-anchor="middle">BAT -</text>
  <text class="pin" x="170" y="250" text-anchor="middle">BAT +</text>
  <text class="pin" x="260" y="295" text-anchor="end">Sig 1</text>
  <text class="pin" x="260" y="325" text-anchor="end">5V</text>
  <text class="pin" x="260" y="355" text-anchor="end">GND</text>
  <text class="pin" x="260" y="395" text-anchor="end">Sig 2</text>
  <text class="sub" x="205" y="340" text-anchor="end">3 pin</text>
  <text class="sub" x="205" y="395" text-anchor="end">1 pin</text>
  <text class="pin" x="100" y="466" text-anchor="middle">Motor A</text>
  <text class="pin" x="210" y="466" text-anchor="middle">Motor B</text>

  <rect class="box" x="40" y="600" width="120" height="60" rx="6"/>
  <text class="title" x="100" y="626" text-anchor="middle">Gecko A</text>
  <text class="sub" x="100" y="646" text-anchor="middle">Brushed motor</text>
  <rect class="box" x="170" y="600" width="120" height="60" rx="6"/>
  <text class="title" x="230" y="626" text-anchor="middle">Gecko B</text>
  <text class="sub" x="230" y="646" text-anchor="middle">Brushed motor</text>

  <rect class="box" x="520" y="240" width="180" height="320" rx="6"/>
  <text class="title" x="610" y="440" text-anchor="middle">ESP32</text>
  <text class="sub" x="610" y="460" text-anchor="middle">Devkit on COM6</text>
  <text class="pin" x="530" y="295">GPIO25</text>
  <text class="pin" x="530" y="325">5V / VIN</text>
  <text class="pin" x="530" y="355">GND</text>
  <text class="pin" x="530" y="395">GPIO26</text>
  <text class="pin" x="690" y="295" text-anchor="end">GPIO16</text>
  <text class="pin" x="690" y="345" text-anchor="end">GPIO21 SDA</text>
  <text class="pin" x="690" y="385" text-anchor="end">GPIO22 SCL</text>
  <text class="pin" x="690" y="525" text-anchor="end">GPIO27</text>

  <rect class="box" x="900" y="60" width="260" height="150" rx="6"/>
  <text class="title" x="1020" y="110">FS-iA6B</text>
  <text class="sub" x="1020" y="130">Receiver</text>
  <text class="sub" x="1020" y="150">Use the iBUS servo port,</text>
  <text class="sub" x="1020" y="166">not the sensor port</text>
  <text class="pin" x="912" y="110">iBUS signal</text>
  <text class="pin" x="912" y="155">5V</text>
  <text class="pin" x="912" y="190">GND</text>

  <rect class="box" x="900" y="250" width="260" height="160" rx="6"/>
  <text class="title" x="1020" y="320">GY-521</text>
  <text class="sub" x="1020" y="340">MPU-6050</text>
  <text class="sub" x="1020" y="358">About 10 mm from</text>
  <text class="sub" x="1020" y="374">spin center</text>
  <text class="pin" x="912" y="280">VCC</text>
  <text class="pin" x="912" y="310">GND</text>
  <text class="pin" x="912" y="345">SDA</text>
  <text class="pin" x="912" y="385">SCL</text>

  <text class="title" x="975" y="515">Heading LED</text>
  <text class="sub" x="975" y="535">Anode on left</text>

  <!-- Notes -->
  <g class="note">
    <text x="330" y="680">Pin positions are arranged for clarity. Match pins by label, not by position.</text>
    <text x="330" y="702">Size R so the LED stays within the GPIO27 current limit.</text>
    <text x="330" y="724">Check on blocks which motor each signal drives. If a motor runs the wrong way, use reverseA or reverseB.</text>
    <text x="330" y="746">Do not power from USB and the ESC BEC together unless the board's USB power path has been checked.</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#15181d">
    <path class="wire bat" d="M40 700 H70"/><text x="78" y="704">Battery</text>
    <path class="wire v5" d="M40 722 H70"/><text x="78" y="726">5V</text>
    <path class="wire gnd" d="M40 744 H70"/><text x="78" y="748">GND</text>
    <path class="wire motor" d="M40 766 H70"/><text x="78" y="770">Motor</text>
    <path class="wire ibus" d="M160 700 H190"/><text x="198" y="704">iBUS</text>
    <path class="wire esc" d="M160 722 H190"/><text x="198" y="726">ESC signal</text>
    <path class="wire i2c" d="M160 744 H190"/><text x="198" y="748">I2C</text>
    <path class="wire led" d="M160 766 H190"/><text x="198" y="770">LED</text>
  </g>
</svg>
